[package]
name = "external-person-enricher"
version = "1.0.0"
edition = "2024"

[[bin]]
name = "external-person-enricher"
path = "src/main.rs"

[dependencies]
crawl = { path = "../../scrapers/crawl" }
mistral-client = { path = "../mistral-client" }
parquet = { version = "54.3.0", features = ["arrow"] }
arrow = "54.3.0"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dotenvy = "0.15.7"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
chrono = { version = "0.4", features = ["serde"] }

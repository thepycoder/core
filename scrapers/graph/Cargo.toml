[package]
name = "graph"
version = "1.0.0"
edition = "2024"

[dependencies]
crawl = { path = "../crawl" }
identity = { path = "../identity" }
parquet = { version = "54.3.0", features = ["arrow"] }
arrow = "54.3.0"
serde_json = "1.0"
dotenvy = "0.15.7"

[dev-dependencies]
normalize = { path = "../normalize" }

[lib]
name = "graph"
path = "src/lib.rs"

[[bin]]
name = "graph"
path = "src/main.rs"

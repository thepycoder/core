[package]
name = "normalize"
version = "1.0.0"
edition = "2024"

[dependencies]
crawl = { path = "../crawl" }
identity = { path = "../identity" }
parquet = { version = "54.3.0", features = ["arrow"] }
arrow = "54.3.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dotenvy = "0.15.7"

[lib]
name = "normalize"
path = "src/lib.rs"

[[bin]]
name = "normalize"
path = "src/main.rs"

[package]
name = "qa"
version = "1.0.0"
edition = "2024"

[dependencies]
crawl = { path = "../crawl" }
identity = { path = "../identity" }
normalize = { path = "../normalize" }
parquet = { version = "54.3.0", features = ["arrow"] }
arrow = "54.3.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
dotenvy = "0.15.7"
regex = "1.11"

[lib]
name = "qa"
path = "src/lib.rs"

[[bin]]
name = "qa"
path = "src/main.rs"

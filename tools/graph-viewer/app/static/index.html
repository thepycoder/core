<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Graph Debug Explorer</title>
  <link rel="stylesheet" href="/style.css?v={{ASSET_VERSION}}" />
</head>
<body>
  <header>
    <h1>Graph Debug Explorer</h1>
    <div id="health-status" class="muted">Loading…</div>
  </header>

  <main>
    <aside id="sidebar">
      <section>
        <h2>Search</h2>
        <input id="search-input" type="search" placeholder="Name, title, question body, answer text…" />
        <label class="field-label" for="search-type">Node type</label>
        <select id="search-type">
          <option value="">All types</option>
          <option value="Person">Person</option>
          <option value="Party">Party</option>
          <option value="Vote">Vote</option>
          <option value="Question">Question</option>
          <option value="Answer">Answer</option>
          <option value="Dossier">Dossier</option>
          <option value="Meeting">Meeting</option>
          <option value="Document">Document</option>
          <option value="Utterance">Utterance</option>
          <option value="Commission">Commission</option>
          <option value="Topic">Topic</option>
        </select>
        <button id="search-btn">Search</button>
        <ul id="search-results"></ul>
      </section>

      <section id="report-section">
        <div class="report-heading">
          <h2>Report coverage</h2>
          <button id="report-close" class="hidden" type="button">Return to graph</button>
        </div>
        <label class="field-label" for="report-session">Session</label>
        <input id="report-session" value="56" inputmode="numeric" />
        <label class="field-label" for="report-kind">Meeting kind</label>
        <select id="report-kind">
          <option value="plenary">Plenary</option>
          <option value="commission">Commission</option>
        </select>
        <label class="field-label" for="report-meeting">Meeting</label>
        <select id="report-meeting"></select>
        <label class="field-label" for="report-entity-filter">Entity type</label>
        <select id="report-entity-filter" multiple size="5">
          <option value="Vote">Vote</option>
          <option value="VoteResult">VoteResult</option>
          <option value="Question">Question</option>
          <option value="Utterance">Utterance</option>
          <option value="Hearing">Hearing</option>
          <option value="Interpellation">Interpellation</option>
          <option value="Proposition">Proposition</option>
          <option value="Notice">Notice</option>
          <option value="Meeting">Meeting</option>
        </select>
        <label class="field-label" for="report-coverage-filter">Coverage</label>
        <select id="report-coverage-filter" multiple size="2">
          <option value="extraction">Extraction</option>
          <option value="scope">Scope</option>
        </select>
        <label class="field-label" for="report-role-filter">Span role (comma-separated)</label>
        <input id="report-role-filter" placeholder="decision_title, result_counts…" />
        <button id="report-clear-filters" type="button">Clear filters</button>
        <div id="report-coverage-stats" class="muted"></div>
        <div id="report-diagnostics"></div>
        <div id="report-block-detail" class="hidden report-block-detail"></div>
        <div id="report-blocks" class="report-blocks"></div>
      </section>

      <section>
        <h2>Issues</h2>
        <ul id="issues-list"></ul>
      </section>
    </aside>

    <section id="inspector-panel">
      <div id="breadcrumb-bar" class="hidden"></div>
      <div id="provenance-bar" class="hidden"></div>
      <div id="inspector-content" class="muted">
        Search for an entity or click an issue sample to inspect links and open source documents.
      </div>
    </section>
  </main>

  <script src="/app.js?v={{ASSET_VERSION}}"></script>
</body>
</html>
